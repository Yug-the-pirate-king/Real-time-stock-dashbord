<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="StockPulse — a real-time stock dashboard for educating people about the stock market."
    />
    <meta name="robots" content="index, follow" />

    <title>StockPulse</title>

    <!--
      PWA assets below use %PUBLIC_URL%, which is replaced with the public
      folder URL at build time. This keeps links working with client-side
      routing and non-root deployments.
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Preconnect / DNS-prefetch to the third-party Leaflet CDN so the browser
      can set up the TCP/TLS connection before the stylesheet and script are
      requested.
    -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- Leaflet CSS with Subresource Integrity for security. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />

    <!--
      Leaflet JS is loaded before the React bundle so window.L is available
      when map components mount. Long-term, prefer importing Leaflet via npm
      to remove this global, render-blocking dependency.
    -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
